# ---- Gradle ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# ---- SteveHUD ----
mod_version=0.1.0
maven_group=com.rate.stevehud
archives_base_name=stevehud

# Fabric Loader is shared by every mod module. It is a runtime dependency and does
# not affect compilation, so one version covers the whole 1.21.x range.
loader_version=0.16.10

# ---- Server side ----
# We compile against the Paper API but deliberately stick to the Spigot-compatible
# API surface, so the resulting jar loads on both Spigot and Paper.
paper_api_version=1.21.4-R0.1-SNAPSHOT
