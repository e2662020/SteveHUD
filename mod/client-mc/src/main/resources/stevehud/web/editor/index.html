<!--
  SteveHUD 导播台（版面编辑器）

  游戏里 /shude 打开，或者直接开 http://127.0.0.1:8787/editor/。

  它编辑的是版面文档 —— 有哪些图形、放在哪、什么颜色、怎么进场。它不编辑比赛：
  比分、名单、计时属于服务端，导播用插件的 /stevehud 命令或者由记分系统推。

  ---------------------------------------------------------------------------
  三个刻意的设计决定
  ---------------------------------------------------------------------------

  1. 画布不是示意图，是嵌在 iframe 里的真实包装页，尺寸正好 1920x1080。
     两个后果值得写下来：

       * 选择框是从 iframe 自己的 DOM 里量出来的，所以它和画面上看到的东西
         不可能对不上 —— 两边不需要各自实现一遍锚点算法；
       * 编辑时把文档 postMessage 进 iframe，所以正在调的就是将要上播的那个
         东西，而不是它的预览。

  2. 页面布局本身是可改的。左右两栏可以拖宽窄、可以折叠，状态存在 localStorage。
     导播台经常同时开在 1080p 和 4K 屏幕上，一个固定宽度不可能两边都合适。

  3. 遮挡预算是一个数字，不是一个感觉。画布右下角实时算出上播元素盖住了多少
     画面、尤其是盖住了多少"画面窗口"（中央 60% x 68%）。同一套规则由
     tools/overlay-audit.mjs 在打包检查里跑，所以"不遮挡观看"是能被证伪的，
     而不是一句设计口号。
-->

<script>
/* SteveHUD 导播台。
 *
 * 文档是唯一真相，编辑期间住在这里。每一次改动去三个地方：
 *
 *   this.doc        导播台手里的那一份，也是 JSON 面板显示的那一份
 *   iframe          通过 postMessage，所以预览立刻跟着动
 *   handles         从 iframe 自己的 DOM 重新量，所以两者不可能对不上
 *
 * 保存时去第四个地方：POST /api/layout，它存盘、广播给每一个其他页面和客户端，
 * 并且喂给游戏内 HUD。
 *
 * 两条规矩比别的都重要：
 *
 *   * 从流里进来的版面绝不覆盖未保存的改动。另一个导播保存一次，不该悄悄丢掉
 *     半小时的拖拽；冲突要报出来，留给人来定。
 *   * 每一个失败都要看得见。保存被拒、流断掉、文档畸形 —— 全部打印在这个页面上
 *     的某个地方，因为另一种可能是导播从直播里发现。
 */
(function () {
  "use strict";

  // ==========================================================================
  // 0. 常量 —— 元素目录
  // ==========================================================================

  /* 每个类型的：中文名、家族（调色板分组）、图标、默认锚点/尺寸、以及它认识
     哪些 options。

     options 是这套东西"能自定义"的地方：每一种数据看板读一组具名参数，而每个
     参数在这里都有中文标签和合适的控件。渲染器不认识的多余键不会被丢掉，会落到
     「其它参数」里继续原样保留 —— 所以先加一个键、后补渲染，是可行的顺序。 */
  var ICONS = {
    bug: '<path d="M4 6h9v5H4z"/><path d="M15 6h5v5h-5z"/><path d="M4 14h16v4H4z"/>',
    event: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h4"/>',
    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
    lower: '<rect x="3" y="13" width="18" height="6" rx="1.5"/><path d="M6 16h5"/>',
    ticker: '<rect x="2" y="9" width="20" height="6" rx="2"/><path d="M6 12h4M13 12h5"/>',
    announce: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h6"/>',
    frame: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    text: '<path d="M5 7h14M12 7v10M9 17h6"/>',
    compare: '<path d="M12 4v16"/><path d="M9 8H4v8h5zM15 8h5v8h-5z"/>',
    table: '<path d="M4 5h16v14H4z"/><path d="M4 10h16M10 5v14"/>',
    chart: '<path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 4-6"/>',
    tiles: '<rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/>',
    roster: '<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c0-2.5 2.2-4 5-4s5 1.5 5 4M13 19c0-2.5 2.2-4 5-4s3 1 3 4"/>',
    series: '<path d="M4 6h16v4H4zM4 14h16v4H4z"/><path d="M8 6v4M16 14v4"/>',
    timeline: '<path d="M6 4v16"/><circle cx="6" cy="8" r="2"/><circle cx="6" cy="16" r="2"/><path d="M10 8h9M10 16h7"/>',
    h2h: '<path d="M4 6h6l2 6-2 6H4M20 6h-6l-2 6 2 6h6"/>'
  };

  function icon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.text) + '</svg>';
  }

  /* 元素目录。family 决定调色板分组，也决定默认放在哪条边上 —— 这样拖进来的
     东西一开始就在一个合理的位置，而不是叠在画面正中。 */
  var TYPES = [
    { type: "matchBug", name: "比分角标", family: "常驻信息", icon: "bug",
      w: 348, h: 0, anchor: "topLeft", x: 40, y: 45,
      desc: "LIVE 徽标 + 逐行比分，比赛期间常驻左上角。",
      options: [
        { key: "clock", label: "右上角时钟", type: "select", values: [["wall", "挂钟"], ["match", "比赛计时"], ["none", "不显示"]] },
        { key: "showLive", label: "显示 LIVE", type: "bool" },
        { key: "liveText", label: "徽标文字", type: "text", placeholder: "LIVE" },
        { key: "title", label: "中间标题", type: "text", placeholder: "留空则用赛事阶段" }
      ] },

    { type: "eventInfo", name: "赛事信息", family: "常驻信息", icon: "event",
      w: 432, h: 0, anchor: "topRight", x: 40, y: 45,
      desc: "右上角的赛事名与阶段。",
      options: [
        { key: "title", label: "赛事名", type: "text", placeholder: "留空则用数据" },
        { key: "subtitle", label: "阶段", type: "text", placeholder: "留空则用数据" }
      ] },

    { type: "timer", name: "计时器", family: "常驻信息", icon: "clock",
      w: 264, h: 0, anchor: "bottomRight", x: 40, y: 0,
      desc: "最大字号的计时，比赛/局间共用。",
      options: [
        { key: "title", label: "时间文本", type: "text", placeholder: "留空则用数据" },
        { key: "subtitle", label: "标签", type: "text", placeholder: "比赛计时" },
        { key: "showDot", label: "显示运行点", type: "bool" }
      ] },

    { type: "lowerThird", name: "选手条", family: "常驻信息", icon: "lower",
      w: 768, h: 0, anchor: "bottomLeft", x: 40, y: 0,
      desc: "从左滑入的介绍条，队伍色块 + 队名 + 选手。",
      options: [
        { key: "mode", label: "主标题", type: "select", values: [["team", "队名"], ["player", "选手名"]] },
        { key: "side", label: "固定队伍 id", type: "text", placeholder: "留空则跟随数据" }
      ] },

    { type: "ticker", name: "信息条", family: "常驻信息", icon: "ticker",
      w: 1920, h: 54, anchor: "bottomLeft", x: 0, y: 0,
      desc: "贴底滚动条。底部锚定的元素会自动让开它。",
      options: [
        { key: "mode", label: "滚动方式", type: "select", values: [["scroll", "滚动"], ["static", "静止"]] },
        { key: "flag", label: "旗帜文字", type: "text", placeholder: "LIVE" },
        { key: "showFlag", label: "显示旗帜", type: "bool" },
        { key: "speed", label: "滚动速度", type: "number", min: 0, max: 200, step: 2, placeholder: "自动" },
        { key: "title", label: "固定首条", type: "text", placeholder: "插在最前面的一条" }
      ] },

    { type: "announcement", name: "公告", family: "常驻信息", icon: "announce",
      w: 0, h: 0, anchor: "center", x: 0, y: -168,
      desc: "居中大字卡，回合切换和赛点用。",
      options: [
        { key: "title", label: "标题", type: "text", placeholder: "留空则用数据" },
        { key: "subtitle", label: "副标", type: "text", placeholder: "留空则用数据" },
        { key: "rules", label: "两侧装饰线", type: "bool" },
        { key: "force", label: "始终显示", type: "bool" }
      ] },

      }

    if (!drag.moved && Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

    if (drag.mode === "move") {
      // 锚点决定偏移的方向：右锚元素的 x 是"从右边数进来"，所以往右拖是减小 x。
      var sx = element.anchor === "topRight" || element.anchor === "bottomRight" ? -1 : 1;
      var sy = element.anchor === "bottomLeft" || element.anchor === "bottomRight" ? -1 : 1;
      element.x = Math.round(drag.origin.x + dx * sx);
      element.y = Math.round(drag.origin.y + dy * sy);
    } else {
      var corner = drag.corner;
      var west = corner === "sw";
      var south = corner === "s" || corner === "se" || corner === "sw";
      // 宽度为 0 是"内容自适应"；第一次拉尺寸时把它固定成当前量到的宽度，
      // 否则拖了半天气死不动。
      var baseW = drag.origin.w > 0 ? drag.origin.w : drag.measured.w;
      var baseH = drag.origin.h > 0 ? drag.origin.h : drag.measured.h;
      if (corner === "e" || corner === "se" || corner === "sw") {
        var dw = (west ? -dx : dx) * (element.anchor === "topRight" || element.anchor === "bottomRight" ? -1 : 1);
        element.width = Math.max(0, Math.round(baseW + dw));
      }
      if (south) {
        var dh = dy * (element.anchor === "bottomLeft" || element.anchor === "bottomRight" ? -1 : 1);
        element.height = Math.max(0, Math.round(baseH + dh));
      }
      // 高度只在用户真的拉过之后才写死；否则保持自适应，让内容决定。
      if (south && drag.origin.h <= 0 && Math.abs(dh) < 3) element.height = 0;
    }

    pushDraft();
    renderHandles();
    renderInspectorGeometry();
    markDirty();
  }

  function endDrag() {
    if (!drag) return;
    var moved = drag.moved;
    drag = null;
    if (moved) {
      log("已移动/缩放 " + (findElement(selectedId) || {}).id, "");
      renderInspector();
      renderLayers();
      // 松手时 iframe 已经画完了，但这里的 rects 还是拖动前量的那一份。
      // 不重量一次，审计和选择框都会停在旧位置上。
      refreshGeometry();
    }
  }

  // 7. 渲染 —— 图层

  function findElement(id) {

        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.4"/></svg>';

      li.appendChild(actions);

      li.addEventListener("click", function () { select(element.id); });
      li.addEventListener("dragstart", function (ev) {

      li.addEventListener("dragend", function () { li.classList.remove("is-dragging"); });
      li.addEventListener("dragover", function (ev) {
        ev.preventDefault();

        li.classList.toggle("is-dropbefore", before);
        li.classList.toggle("is-dropafter", !before);

      li.addEventListener("dragleave", function () {

      ul.appendChild(li);

    list.appendChild(el("p", "ed-hint",

  function reorder(from, to) {
    if (from === to || from === to - 1) return;

  function addElement(spec) {

    var used = {};

    layout.appendChild(field("锚点", selectInput(element.anchor, ANCHORS,

    var geo = el("div", "ed-inline");

    geo.appendChild(field("Y（向内）", numberInput(element.y,
      function (v) { element.y = Number(v || 0); changed({ inspector: false }); renderHandles(); },

    style.appendChild(el("p", "ed-hint",

    [["accent", "强调色"], ["panel", "面板色"], ["ink", "文字色"]].forEach(function (pair) {

  var guides = { grid: false, third: false, window: true, safe: false, labels: true };

  function renderGuides() {
    var W = (doc && doc.canvas ? doc.canvas.width : 1920) * scale;
    var H = (doc && doc.canvas ? doc.canvas.height : 1080) * scale;
    var safe = (doc && doc.safe) || { x: 40, y: 45 };
    var windowRect = { x: W * 0.20, y: H * 0.16, w: W * 0.60, h: H * 0.68 };

    setGuide("guideGrid", guides.grid, { x: 0, y: 0, w: W, h: H });
    setGuide("guideThird", guides.third, { x: W / 3, y: 0, w: W / 3, h: H });
    setGuide("guideWindow", guides.window, windowRect);
    setGuide("guideSafe", guides.safe,
      { x: safe.x * scale, y: safe.y * scale, w: W - safe.x * scale * 2, h: H - safe.y * scale * 2 });

    document.querySelectorAll(".ed-toggle").forEach(function (button) {
      button.setAttribute("aria-pressed", guideOn(button.getAttribute("data-guide")) ? "true" : "false");
    });

  function setGuide(id, on, rect) {
    var node = $(id);
    node.classList.toggle("is-on", !!on);
    node.style.left = rect.x + "px";
    node.style.top = rect.y + "px";
    node.style.width = rect.w + "px";
    node.style.height = rect.h + "px";
    if (id === "guideGrid") {

  function fitCanvas() {
    var stage = $("stage");
    var pad = 40;
    var availW = stage.clientWidth - pad;
    var availH = stage.clientHeight - pad;
    var W = doc && doc.canvas ? doc.canvas.width : 1920;
    var H = doc && doc.canvas ? doc.canvas.height : 1080;
    if (zoomMode === "fit") {
      scale = Math.max(0.05, Math.min(availW / W, availH / H));

    var canvas = $("canvas");
    canvas.style.width = (W * scale) + "px";
    canvas.style.height = (H * scale) + "px";
    var scaler = $("scaler");
    scaler.style.transform = "scale(" + scale + ")";
    scaler.style.width = W + "px";
    scaler.style.height = H + "px";
    $("chipZoom").querySelector("span").textContent = Math.round(scale * 100) + "%";

  function save() {
    if (!doc) return;
    $("saveLabel").textContent = "正在保存…";
    fetch("/api/layout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(doc)
    }).then(function (res) {
      return res.text().then(function (text) {
        if (!res.ok) throw new Error("HTTP " + res.status + " " + text.slice(0, 160));
        return text;
      });
    }).then(function (text) {
      var stored = null;
      try { stored = JSON.parse(text); } catch (e) { /* 服务端可能回非 JSON */ }
      if (stored && stored.elements) {
        // 服务端会规整文档（补默认值、去重 id、丢掉未知类型）。把规整后的
        // 那份认回来，页面显示的才是真正存进去的东西。
        doc = stored;
        pushDraft();
        renderAll();

      savedJson = serialise();
      dirtyFlag = false;

      log("已保存并广播给所有客户端与包装页", "ok");

  function openStream() {
    var source;
    try { source = new EventSource("/events"); }
    catch (e) { scheduleRetry(); return; }

    source.onopen = function () {
      sseOpen = true;
      attempt = 0;
      setChip("chipLink", "已连接", "on");
      renderGuides();
    };

    source.addEventListener("layout", function (event) {
      var incoming;
      try { incoming = JSON.parse(event.data); } catch (e) { return; }
      if (!incoming || !incoming.elements) return;
      // 未保存的改动不会被流冲掉。另一个导播保存一次，不该悄悄丢掉半小时的
      // 拖拽；冲突报出来，留给人来定。
      if (dirtyFlag) {
        log("服务端版面已更新，但本机有未保存的改动，未覆盖。点「保存并广播」会用本机版本覆盖。" , "warn");
        return;
      }
      doc = incoming;
      savedJson = serialise();
      if (!findElement(selectedId)) selectedId = doc.elements.length ? doc.elements[0].id : "";
      renderAll();
      if (localEdits) log("版面被其他导播更新，已同步", "");
      localEdits = false;
    });

    source.onmessage = function (event) {
      var parsed;
      try { parsed = JSON.parse(event.data); } catch (e) { return; }
      if (!parsed || typeof parsed !== "object") return;
      liveState = parsed;
      updateDataChips();
      renderBudget();
      renderHandles();
      renderData();
    };

    source.onerror = function () {
      if (source.readyState === EventSource.CLOSED || true) {
        try { source.close(); } catch (e) { /* 已经没了 */ }
      }
      sseOpen = false;
      attempt++;
      setChip("chipLink", "已断线 · 重连 #" + attempt, "bad");
      scheduleRetry();
    };
  }

  function scheduleRetry() {
    var delay = Math.min(RETRY_MAX_MS, RETRY_BASE_MS * Math.pow(1.7, Math.min(attempt - 1, 8)));
    clearTimeout(retryTimer);
    retryTimer = setTimeout(openStream, delay);
  }

  function updateDataChips() {
    var s = liveState || {};
    setChip("chipData", s.preview ? "本地预览数据" : "赛事数据已连接",
      s.preview ? "warn" : "on");
    scope = { scope: s.layoutScope || "local", author: s.layoutAuthor || "", preset: s.layoutPreset || "" };
    var serverWide = scope.scope === "server";
    setChip("chipScope", serverWide ? "全服版面生效中" : "本机版面", serverWide ? "warn" : "");
    var note = $("scopeNote");
    note.classList.toggle("is-hidden", !serverWide);
    if (serverWide) {
      note.innerHTML = "当前生效的是<b>全服版面</b>" +
        (scope.author ? "（由 " + esc(scope.author) + " 设定）" : "") +
        "。你在这里做的改动只影响本机，暂时不会出现在画面上。要换回本机版面，" +
        "让管理员执行 <b>/stevehud layout clear</b>。";
    }
  }

  // ==========================================================================
  // 15. 整体渲染
  // ==========================================================================

  function renderAll() {
    // 每次整体重画之后都要延后重量一次：postMessage 是异步的，紧接着量到的还是
    // 上一版的几何。审计、选择框、遮挡预算全都依赖这一次测量。
    refreshGeometry();
    renderLayers();
    renderInspector();
    renderTheme();
    renderJsonPane();
    renderPresets();
    renderData();
    fitCanvas();
    updateDataChips();
  }

  // ==========================================================================
  // 16. 交互
  // ==========================================================================

  function bindTabs(root, map) {
    root.querySelectorAll(".ed-tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        root.querySelectorAll(".ed-tab").forEach(function (other) {
          other.setAttribute("aria-selected", other === tab ? "true" : "false");
        });
        Object.keys(map).forEach(function (key) {
          $(map[key]).classList.toggle("is-active", key === tab.getAttribute("data-tab"));
        });
      });
    });
  }

  bindTabs($("railLeft"), {
    preset: "panelPreset", layers: "panelLayers", data: "panelData"
  });
  bindTabs($("railRight"), {
    inspector: "panelInspector", theme: "panelTheme", json: "panelJson"
  });

  // ---- 侧栏宽度与折叠 ----
  var railPrefs = { left: 288, right: 344, leftCollapsed: false, rightCollapsed: false };
  try {
    var storedRail = JSON.parse(localStorage.getItem("stevehud.editor.rails") || "null");
    if (storedRail) railPrefs = Object.assign(railPrefs, storedRail);
  } catch (e) { /* 隐私模式下 localStorage 会抛，忽略即可 */ }

  function applyRailPrefs() {
    var shell = $("shell");
    shell.style.setProperty("--ed-rail-left", railPrefs.left + "px");
    shell.style.setProperty("--ed-rail-right", railPrefs.right + "px");
    shell.classList.toggle("left-collapsed", railPrefs.leftCollapsed);
    shell.classList.toggle("right-collapsed", railPrefs.rightCollapsed);
    $("railLeft").classList.toggle("is-collapsed", railPrefs.leftCollapsed);
    $("railRight").classList.toggle("is-collapsed", railPrefs.rightCollapsed);
    try { localStorage.setItem("stevehud.editor.rails", JSON.stringify(railPrefs)); } catch (e) {}
    requestAnimationFrame(fitCanvas);
  }

  function bindGrip(gripId, side) {
    var grip = $(gripId);
    var dragging = false;
    grip.addEventListener("pointerdown", function (ev) {
      dragging = true;
      grip.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    grip.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      var value = side === "left" ? ev.clientX : window.innerWidth - ev.clientX;
      railPrefs[side] = clamp(Math.round(value), 180, 640);
      railPrefs[side + "Collapsed"] = false;
      applyRailPrefs();
    });
    grip.addEventListener("pointerup", function (ev) {
      dragging = false;
      grip.releasePointerCapture && grip.releasePointerCapture(ev.pointerId);
    });
    // 双击折叠：这是最常用的一下，藏在拖拽里就太费事了。
    grip.addEventListener("dblclick", function () {
      railPrefs[side + "Collapsed"] = !railPrefs[side + "Collapsed"];
      applyRailPrefs();
    });
  }

  bindGrip("gripLeft", "left");
  bindGrip("gripRight", "right");
  document.querySelectorAll("[data-expand]").forEach(function (button) {
    button.addEventListener("click", function () {
      var side = button.getAttribute("data-expand");
      railPrefs[side + "Collapsed"] = false;
      applyRailPrefs();
    });
  });
  applyRailPrefs();

  // ---- 画布交互 ----
  $("handles").addEventListener("pointerdown", startDrag);
  window.addEventListener("pointermove", moveDrag);
  window.addEventListener("pointerup", endDrag);

  // 点画布空白处取消选择；点元素选中它。点在 iframe 上的事件拿不到，所以
  // 用一个覆盖层做命中测试，而不是监听 iframe 内部。
  $("canvas").addEventListener("pointerdown", function (ev) {
    if (ev.target.closest(".ed-handle") || ev.target.closest(".ed-box")) return;
    var rect = $("canvas").getBoundingClientRect();
    var x = (ev.clientX - rect.left) / scale;
    var y = (ev.clientY - rect.top) / scale;
    var hit = null;
    for (var i = doc.elements.length - 1; i >= 0; i--) {
      var candidate = doc.elements[i];
      var r = rects[candidate.id];
      if (!r) continue;
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { hit = candidate.id; break; }
    }
    select(hit || "");
  });

  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (ev.key === "Escape") { select(""); return; }
    if (ev.key === "Delete" || ev.key === "Backspace") {
      if (selectedId) { removeSelected(); ev.preventDefault(); }
      return;
    }
    if (ev.key === "s" && (ev.ctrlKey || ev.metaKey)) { save(); ev.preventDefault(); return; }
    var step = ev.shiftKey ? 10 : 1;
    if (ev.key === "ArrowLeft") { nudge(-step, 0); ev.preventDefault(); }
    if (ev.key === "ArrowRight") { nudge(step, 0); ev.preventDefault(); }
    if (ev.key === "ArrowUp") { nudge(0, -step); ev.preventDefault(); }
    if (ev.key === "ArrowDown") { nudge(0, step); ev.preventDefault(); }
  });

  document.querySelectorAll(".ed-toggle").forEach(function (button) {
    button.addEventListener("click", function () {
      var key = button.getAttribute("data-guide");
      guides[key] = !guides[key];
      renderGuides();
      renderHandles();
    });
  });

  // ---- 工具栏 ----
  $("btnSave").addEventListener("click", save);
  $("btnRevert").addEventListener("click", function () {
    if (!dirtyFlag || window.confirm("放弃所有未保存的改动？")) {
      loadLayout().then(function () { log("已回到上一次保存的版本", "warn"); });
    }
  });
  $("btnFit").addEventListener("click", function () {
    zoomMode = "fit";
    fitCanvas();
  });
  $("btnZoomIn").addEventListener("click", function () { zoomMode = "manual"; scale = clamp(scale * 1.15, 0.1, 2); fitCanvas(); });
  $("btnZoomOut").addEventListener("click", function () { zoomMode = "manual"; scale = clamp(scale / 1.15, 0.1, 2); fitCanvas(); });
  $("btnExport").addEventListener("click", function () {
    var blob = new Blob([serialise()], { type: "application/json" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "stevehud-layout.json";
    link.click();
    URL.revokeObjectURL(link.href);
    log("已导出 JSON", "ok");
  });
  $("btnImport").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!parsed || !parsed.elements) throw new Error("缺少 elements");
        doc = parsed;
        selectedId = doc.elements.length ? doc.elements[0].id : "";
        pushDraft();
        markDirty();
        renderAll();
        log("已导入 " + file.name, "ok");
      } catch (e) {
        log("导入失败：" + e.message, "bad");
      }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  $("btnFormat").addEventListener("click", function () {
    try {
      var parsed = JSON.parse($("json").value);
      doc = parsed;
      pushDraft();
      markDirty();
      renderAll();
      log("JSON 已格式化", "ok");
    } catch (e) {
      log("JSON 无法解析：" + e.message, "bad");
    }
  });
  $("btnApplyJson").addEventListener("click", function () {
    try {
      var parsed = JSON.parse($("json").value);
      if (!parsed || !parsed.elements) throw new Error("缺少 elements 数组");
      doc = parsed;
      if (!findElement(selectedId)) selectedId = doc.elements.length ? doc.elements[0].id : "";
      pushDraft();
      markDirty();
      renderAll();
      log("已应用 JSON 面板里的文档", "ok");
    } catch (e) {
      log("应用失败：" + e.message, "bad");
    }
  });

  // ---- 控制台 ----
  $("btnConsole").addEventListener("click", function () {
    $("shell").classList.toggle("has-console");
    requestAnimationFrame(fitCanvas);
  });
  $("btnCloseConsole").addEventListener("click", function () {
    $("shell").classList.remove("has-console");
    requestAnimationFrame(fitCanvas);
  });
  $("btnClearLog").addEventListener("click", function () { logs = []; renderLog(); });

  // ---- iframe ----
  frame.addEventListener("load", function () {
    log("预览已就绪", "");
    setTimeout(function () {
      pushDraft();
      measure();
      renderHandles();
      renderBudget();
    }, 120);
  });

  window.addEventListener("resize", function () {
    if (zoomMode === "fit") fitCanvas();
    else { renderGuides(); renderHandles(); }
  });

  // ==========================================================================
  // 17. 启动
  // ==========================================================================

  log("导播台启动，正在连接本机图形服务…", "");
  Promise.all([loadPresets(), loadLayout()])
    .then(function () { openStream(); })
    ["catch"](function (e) {
      log("载入失败：" + e.message, "bad");
      openStream();
    });
})();
</script>
</body>
</html>
