minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
fabric_api_version=0.116.17+1.21.1
cloth_config_version=15.0.140
modmenu_version=11.0.4
# Fabric's version syntax is NOT Maven's: an interval like [1.21,1.21.2) matches
# nothing, not even the version equal to its own lower bound. Space-separated
# comparators are the form that actually works, verified against Fabric Loader's
# own parser. The trailing "-" on each bound is what real mods use so that
# pre-releases of the same version (1.21.1-rc.1 etc.) stay inside the window.
#
# This jar is declared for 1.21 as well: the two are protocol-identical and share
# every API we touch.
minecraft_dependency_range=>=1.21- <1.21.2-
